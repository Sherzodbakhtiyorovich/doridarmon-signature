<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Imzo qo'yish</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--tg-theme-bg-color, #fff);
    color: var(--tg-theme-text-color, #000);
    padding: 12px;
    min-height: 100vh;
    user-select: none;
  }
  h2 { font-size: 18px; margin-bottom: 8px; color: var(--tg-theme-hint-color, #555); }
  .info {
    background: var(--tg-theme-secondary-bg-color, #f0f0f0);
    padding: 10px; border-radius: 8px; margin-bottom: 12px; font-size: 14px;
  }
  .info b { color: var(--tg-theme-link-color, #2481cc); }
  #canvas-wrap {
    border: 2px dashed #888; border-radius: 12px;
    background: #fff; position: relative; margin-bottom: 12px;
    touch-action: none;
  }
  #sigCanvas { width: 100%; height: 260px; display: block; cursor: crosshair; }
  .hint { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
         color: #bbb; font-size: 14px; pointer-events: none; }
  .buttons { display: flex; gap: 8px; flex-direction: column; }
  button {
    padding: 14px; font-size: 16px; border: none; border-radius: 10px;
    cursor: pointer; font-weight: 600; transition: opacity 0.2s;
  }
  .btn-save { background: var(--tg-theme-button-color, #2481cc); color: var(--tg-theme-button-text-color, #fff); }
  .btn-clear { background: #f44336; color: #fff; }
  .btn-cancel { background: #888; color: #fff; }
  button:active { opacity: 0.7; }
  button:disabled { opacity: 0.5; }
</style>
</head>
<body>

<h2>✍️ Qabul qildim — imzo qo'ying</h2>
<div class="info">
  🏢 <b id="orgName">Tashkilot</b><br>
  🆔 INN: <b id="orgInn">-</b><br>
  📅 <b id="dateTime"></b>
</div>

<div id="canvas-wrap">
  <canvas id="sigCanvas"></canvas>
  <div class="hint" id="hint">Barmoq bilan imzo chizing</div>
</div>

<div class="buttons">
  <button class="btn-save" id="btnSave">✅ Imzoni saqlash</button>
  <button class="btn-clear" id="btnClear">🗑 Tozalash</button>
  <button class="btn-cancel" id="btnCancel">❌ Bekor qilish</button>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

// URL dan ma'lumot olish
const params = new URLSearchParams(window.location.search);
document.getElementById('orgName').textContent = params.get('name') || 'Tashkilot';
document.getElementById('orgInn').textContent  = params.get('inn')  || '-';
document.getElementById('dateTime').textContent = new Date().toLocaleString('uz-UZ');

// Canvas sozlash
const canvas = document.getElementById('sigCanvas');
const hint   = document.getElementById('hint');
const ctx    = canvas.getContext('2d');

function resizeCanvas() {
  const rect = canvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  canvas.width  = rect.width * dpr;
  canvas.height = rect.height * dpr;
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#000';
  ctx.lineWidth   = 3;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  // Oq fon
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, rect.width, rect.height);
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

let drawing = false;
let hasDrawn = false;

function getPos(e) {
  const rect = canvas.getBoundingClientRect();
  const touch = e.touches && e.touches[0];
  return {
    x: (touch ? touch.clientX : e.clientX) - rect.left,
    y: (touch ? touch.clientY : e.clientY) - rect.top
  };
}

function start(e) {
  e.preventDefault();
  drawing = true;
  hasDrawn = true;
  hint.style.display = 'none';
  const p = getPos(e);
  ctx.beginPath();
  ctx.moveTo(p.x, p.y);
}

function move(e) {
  if (!drawing) return;
  e.preventDefault();
  const p = getPos(e);
  ctx.lineTo(p.x, p.y);
  ctx.stroke();
}

function end(e) {
  e && e.preventDefault && e.preventDefault();
  drawing = false;
}

canvas.addEventListener('mousedown', start);
canvas.addEventListener('mousemove', move);
canvas.addEventListener('mouseup',   end);
canvas.addEventListener('mouseleave',end);
canvas.addEventListener('touchstart',start, {passive: false});
canvas.addEventListener('touchmove', move,  {passive: false});
canvas.addEventListener('touchend',  end);

// Tozalash
document.getElementById('btnClear').onclick = () => {
  const rect = canvas.getBoundingClientRect();
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, rect.width, rect.height);
  hasDrawn = false;
  hint.style.display = 'block';
};

// Saqlash
document.getElementById('btnSave').onclick = () => {
  if (!hasDrawn) {
    tg.showAlert('Iltimos, avval imzo chizing!');
    return;
  }
  const dataURL = canvas.toDataURL('image/png');
  tg.sendData(JSON.stringify({
    type: 'signature',
    inn:  params.get('inn') || '',
    data: dataURL,
    timestamp: new Date().toISOString()
  }));
  tg.close();
};

// Bekor qilish
document.getElementById('btnCancel').onclick = () => {
  tg.close();
};
</script>
</body>
</html>
