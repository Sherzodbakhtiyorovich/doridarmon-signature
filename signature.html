<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Imzo qo'yish</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--tg-theme-bg-color, #fff);
    color: var(--tg-theme-text-color, #000);
    padding: 12px;
    min-height: 100vh;
    user-select: none;
    overscroll-behavior: none;
  }
  h2 { font-size: 18px; margin-bottom: 8px; color: var(--tg-theme-hint-color, #555); }
  .info {
    background: var(--tg-theme-secondary-bg-color, #f0f0f0);
    padding: 10px; border-radius: 8px; margin-bottom: 12px; font-size: 14px;
  }
  .info b { color: var(--tg-theme-link-color, #2481cc); }
  #canvas-wrap {
    border: 2px dashed #888; border-radius: 12px;
    background: #fff; position: relative; margin-bottom: 12px;
    touch-action: none;
  }
  #sigCanvas { width: 100%; height: 280px; display: block; cursor: crosshair; touch-action: none; }
  .hint { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
         color: #bbb; font-size: 14px; pointer-events: none; }
  .buttons { display: flex; gap: 8px; flex-direction: column; }
  button {
    padding: 14px; font-size: 16px; border: none; border-radius: 10px;
    cursor: pointer; font-weight: 600; transition: opacity 0.2s;
  }
  .btn-save { background: #28a745; color: #fff; }
  .btn-clear { background: #dc3545; color: #fff; }
  .btn-cancel { background: #6c757d; color: #fff; }
  button:active { opacity: 0.7; }
  button:disabled { opacity: 0.5; }
  #status { padding: 10px; margin-top: 8px; border-radius: 8px;
            text-align: center; font-size: 14px; display: none; }
  #status.show { display: block; }
  #status.success { background: #d4edda; color: #155724; }
  #status.error { background: #f8d7da; color: #721c24; }
  #status.info { background: #d1ecf1; color: #0c5460; }
</style>
</head>
<body>

<h2>✍️ Qabul qildim — imzo qo'ying</h2>
<div class="info">
  🏢 <b id="orgName">Tashkilot</b><br>
  🆔 INN: <b id="orgInn">-</b><br>
  📅 <b id="dateTime"></b>
</div>

<div id="canvas-wrap">
  <canvas id="sigCanvas"></canvas>
  <div class="hint" id="hint">Barmoq bilan imzo chizing</div>
</div>

<div class="buttons">
  <button class="btn-save" id="btnSave">✅ Imzoni saqlash</button>
  <button class="btn-clear" id="btnClear">🗑 Tozalash</button>
  <button class="btn-cancel" id="btnCancel">❌ Bekor qilish</button>
</div>

<div id="status"></div>

<script>
let tg = null;
try {
  tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();
} catch(e) {
  console.error('Telegram WebApp init xato:', e);
}

const params = new URLSearchParams(window.location.search);
document.getElementById('orgName').textContent = decodeURIComponent(params.get('name') || 'Tashkilot');
document.getElementById('orgInn').textContent  = params.get('inn')  || '-';
document.getElementById('dateTime').textContent = new Date().toLocaleString('uz-UZ');

const canvas = document.getElementById('sigCanvas');
const hint   = document.getElementById('hint');
const ctx    = canvas.getContext('2d');
const status = document.getElementById('status');

function showStatus(text, type) {
  status.textContent = text;
  status.className = 'show ' + type;
  if (type === 'success') {
    setTimeout(() => { status.className = ''; }, 3000);
  }
}

function resizeCanvas() {
  const rect = canvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  canvas.width  = rect.width * dpr;
  canvas.height = rect.height * dpr;
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#000';
  ctx.lineWidth   = 3;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, rect.width, rect.height);
}
resizeCanvas();

let drawing = false;
let hasDrawn = false;

function getPos(e) {
  const rect = canvas.getBoundingClientRect();
  const touch = e.touches && e.touches[0];
  return {
    x: (touch ? touch.clientX : e.clientX) - rect.left,
    y: (touch ? touch.clientY : e.clientY) - rect.top
  };
}

function start(e) { e.preventDefault(); drawing = true; hasDrawn = true; hint.style.display = 'none';
                    const p = getPos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); }
function move(e)  { if (!drawing) return; e.preventDefault(); const p = getPos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); }
function end(e)   { e && e.preventDefault && e.preventDefault(); drawing = false; }

canvas.addEventListener('mousedown', start);
canvas.addEventListener('mousemove', move);
canvas.addEventListener('mouseup',   end);
canvas.addEventListener('mouseleave',end);
canvas.addEventListener('touchstart',start, {passive: false});
canvas.addEventListener('touchmove', move,  {passive: false});
canvas.addEventListener('touchend',  end);

document.getElementById('btnClear').onclick = () => {
  const rect = canvas.getBoundingClientRect();
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, rect.width, rect.height);
  hasDrawn = false;
  hint.style.display = 'block';
  showStatus('🗑 Tozalandi', 'success');
};

// Imzoni kichraytirib JPEG ga aylantirish
function compressSignature(maxBytes = 3500) {
  // Bir nechta o'lchamda urinib ko'ramiz
  const sizes = [
    [400, 200, 0.7],
    [350, 175, 0.6],
    [300, 150, 0.5],
    [250, 125, 0.45],
    [200, 100, 0.4],
    [180, 90, 0.35],
    [150, 75, 0.3],
  ];

  for (const [w, h, q] of sizes) {
    const tmp = document.createElement('canvas');
    tmp.width = w; tmp.height = h;
    const tctx = tmp.getContext('2d');
    tctx.fillStyle = '#fff';
    tctx.fillRect(0, 0, w, h);
    tctx.drawImage(canvas, 0, 0, w, h);

    const dataURL = tmp.toDataURL('image/jpeg', q);
    // JSON ichidagi hajm
    const jsonSize = JSON.stringify({t:'sig', i: params.get('inn') || '', d: dataURL}).length;
    console.log(`O'lcham ${w}x${h} q=${q} → JSON: ${jsonSize} bayt`);
    if (jsonSize < maxBytes) {
      return { dataURL, w, h, q, size: jsonSize };
    }
  }
  return null;
}

document.getElementById('btnSave').onclick = () => {
  if (!hasDrawn) {
    showStatus('⚠️ Avval imzo chizing!', 'error');
    return;
  }
  if (!tg) {
    showStatus('❌ Telegram WebApp aniqlanmadi', 'error');
    return;
  }

  try {
    showStatus('💾 Saqlanmoqda...', 'info');

    const compressed = compressSignature();
    if (!compressed) {
      showStatus('❌ Imzo juda murakkab. Kichraytirib qaytadan chizing.', 'error');
      return;
    }

    console.log(`Final: ${compressed.w}x${compressed.h} q=${compressed.q} → ${compressed.size} bayt`);

    const payload = JSON.stringify({
      t: 'sig',
      i: params.get('inn') || '',
      d: compressed.dataURL
    });

    tg.sendData(payload);

    showStatus(`✅ Yuborildi! (${compressed.size} bayt)`, 'success');
    setTimeout(() => { try { tg.close(); } catch(e){} }, 600);
  } catch (e) {
    console.error('Saqlash xato:', e);
    showStatus('❌ Xato: ' + e.message, 'error');
  }
};

document.getElementById('btnCancel').onclick = () => {
  if (tg) { try { tg.close(); } catch(e){} }
};
</script>
</body>
</html>
